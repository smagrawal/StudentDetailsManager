<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Details Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="datetime-display"></div>
  <div class="container">
    <h1>Student Details Manager</h1>

    <section class="card">
      <h2 id="form-title">Add Student</h2>
      <form id="student-form">
        <input type="hidden" id="studentId" name="studentId" />
        <div class="field">
          <label for="studentName">Student Name *</label>
          <input type="text" id="studentName" name="studentName" required />
        </div>
        <div class="field">
          <label for="className">Class *</label>
          <input type="text" id="className" name="className" required />
        </div>
        <div class="field">
          <label for="schoolName">School Name *</label>
          <input type="text" id="schoolName" name="schoolName" required />
        </div>
        <div class="field">
          <label for="section">Section</label>
          <input type="text" id="section" name="section" />
        </div>
        <div class="field">
          <label for="dob">DOB (Date of Birth)</label>
          <input type="date" id="dob" name="dob" />
        </div>
        <div class="field">
          <label for="tuitionBeginDate">Tuition Begin Date</label>
          <input type="date" id="tuitionBeginDate" name="tuitionBeginDate" />
        </div>
        <div class="field">
          <label for="fatherName">Father Name</label>
          <input type="text" id="fatherName" name="fatherName" />
        </div>
        <div class="field">
          <label for="motherName">Mother Name</label>
          <input type="text" id="motherName" name="motherName" />
        </div>
        <div class="field">
          <label for="aadharNo">Aadhar No</label>
          <input type="text" id="aadharNo" name="aadharNo" placeholder="12 digit number" maxlength="12" />
        </div>
        <div class="field">
          <label for="fatherOccupation">Father's Occupation</label>
          <input type="text" id="fatherOccupation" name="fatherOccupation" />
        </div>
        <div class="field">
          <label for="contactNo">Contact No</label>
          <input type="text" id="contactNo" name="contactNo" placeholder="10 digit number" maxlength="10" />
        </div>

        <button type="submit" id="submit-btn">Add Student</button>
        <button type="button" id="cancel-edit-btn" style="display:none;">Cancel</button>
      </form>
      <p id="form-message"></p>
    </section>

    <section class="card">
      <h2>Retrieve Students</h2>
      <div class="search-row">
        <input type="text" id="search" placeholder="Search by name, Aadhar No or Contact No" />
        <button id="search-btn">Search</button>
        <button id="show-all-btn">Show All</button>
      </div>

      <div class="table-wrapper">
        <table id="students-table">
          <thead>
            <tr>
              <th>Student Name</th>
              <th>Class</th>
              <th>School Name</th>
              <th>Section</th>
              <th>DOB</th>
              <th>Tuition Begin</th>
              <th>Father Name</th>
              <th>Mother Name</th>
              <th>Aadhar No</th>
              <th>Father's Occupation</th>
              <th>Contact No</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="results-message"></p>
    </section>
  </div>

  <div id="fees-modal-overlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Fee Details &mdash; <span id="fees-student-name"></span></h2>
        <button type="button" id="fees-close-btn" class="close-btn">&times;</button>
      </div>
      <div class="table-wrapper">
        <table id="fees-table">
          <thead>
            <tr>
              <th>Month</th>
              <th>Status</th>
              <th>Amount Received</th>
              <th>Paid Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="fees-message"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
